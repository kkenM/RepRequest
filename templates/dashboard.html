<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - RepRequest</title>
</head>

<body>

    <h1>RepRequest Dashboard</h1>

    <h2>Welcome, {{ current_user.first_name }}!</h2>

    <p>
        Company:
        {{ current_user.company.name }}
    </p>

    <p>
        Name:
        {{ current_user.first_name }}
        {{ current_user.last_name }}
    </p>

    <p>
        Email:
        {{ current_user.email }}
    </p>

    <p>
        Role:
        {{ current_user.role }}
    </p>

    <form method="POST" action="{{ url_for('logout') }}">
        <button type="submit">
            Logout
        </button>
    </form>

</body>

</html>
