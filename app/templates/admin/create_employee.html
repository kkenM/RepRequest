<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>

  <h1>Create Employee Account</h1>

  <p>
    Company: {{ current_user.company.name }}
  </p>

  {% if error %}
  <p>{{ error }}</p>
  {% endif %}

  <form method="POST">

    <label for="first_name">First Name:</label>
      <input
        type="text"
        id="first_name"
        name="first_name"
        required
      >

    <br><br>

    <label for="last_name">Last Name:</label>
      <input
        type="text"
        id="last_name"
        name="last_name"
        required
      >

    <br><br>

    <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        required
      >

    <br><br>

    <label for="password">Temporary Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      >

    <br><br>

    <label for="role">Employee Role:</label>

    <select
      id="role"
      name="role"
      required
    >
      <option value="">Select Role</option>
      <option value="employee-crew">
        Crew Employee
      </option>
      <option value="employee-technician">
        Technician
      </option>
    </select>

    <br><br>

    <button type="submit">
      Create Employee
    </button>

  </form>

  <br>

  <a href="{{ url_for('admin.dashboard') }}">
    Return to Administration
  </a>

</body>

</html>
