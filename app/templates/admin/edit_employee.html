<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Employee - RepRequest</title>
</head>

<body>

    <h1>Edit Employee</h1>

    <p>
        Company:
        {{ current_user.company.name }}
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="first_name">
            First Name:
        </label>

        <input
            type="text"
            id="first_name"
            name="first_name"
            value="{{ employee.first_name }}"
            required
        >

        <br><br>

        <label for="last_name">
            Last Name:
        </label>

        <input
            type="text"
            id="last_name"
            name="last_name"
            value="{{ employee.last_name }}"
            required
        >

        <br><br>

        <label for="email">
            Email:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ employee.email }}"
            required
        >

        <br><br>

        <label for="role">
            Employee Role:
        </label>

        <select
            id="role"
            name="role"
            required
        >

            {% for role_value, role_label in employee_role_options %}

                <option
                    value="{{ role_value }}"
                    {% if employee.role == role_value %}selected{% endif %}
                >
                    {{ role_label }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{{ url_for('admin.dashboard') }}">
        Cancel
    </a>

</body>

</html>
