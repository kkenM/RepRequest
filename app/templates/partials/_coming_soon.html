{#
    Shared placeholder body for features that are designed but not yet built.

    Expects:  feature_title, feature_lede, feature_points (list of strings)
#}
<div class="card">
    <div class="empty">

        <span class="empty__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7v5l3 2"/>
            </svg>
        </span>

        <h3>{{ feature_title }}</h3>
        <p>{{ feature_lede }}</p>

        <div class="grid grid--3" style="text-align:left; max-width:820px; margin:0 auto;">
            {% for point in feature_points %}
                <div class="stat">
                    <p class="stat__label">Planned</p>
                    <p class="stat__value stat__value--sm">{{ point }}</p>
                </div>
            {% endfor %}
        </div>

        <p class="mt-4 mb-0">
            <a class="btn btn--secondary" href="{{ url_for('main.dashboard') }}">
                Back to dashboard
            </a>
        </p>

    </div>
</div>
