<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password - RepRequest</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    {% include "partials/_head_icons.html" %}
</head>

<body>

    {% include "partials/_topbar.html" %}

    <div class="auth">
        <div class="auth__card">

            <img class="auth__logo"
                 src="{{ url_for('static', filename='img/logo.png') }}"
                 alt="RepRequest - Machine Management Software"
                 width="1200" height="310">

            <div class="auth__head">
                <h1>Forgot your password?</h1>
                <p>We'll email a reset link to the address on your account.</p>
            </div>

            {% include "partials/_flashes.html" %}

            <form class="form" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form__group">
                    <label class="form__label" for="login">Username or email</label>
                    <input class="form__control" type="text" id="login" name="login"
                           autocomplete="username" autocapitalize="none"
                           placeholder="jdoe42 or you@company.com" required>
                </div>

                <button type="submit" class="btn btn--primary btn--block btn--lg">
                    Send reset link
                </button>

            </form>

            <p class="auth__foot">
                Remembered it? <a href="{{ url_for('auth.login') }}">Back to log in</a>
            </p>

        </div>
    </div>

    {% include "partials/_footer.html" %}

</body>

</html>
