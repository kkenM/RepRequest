<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Company</title>
</head>

<body>

    <h1>Register Company</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <h2>Company Information</h2>

        <label for="company_name">Company Name:</label>
        <input
            type="text"
            id="company_name"
            name="company_name"
            required
        >

        <h2>Administrator Information</h2>

        <label for="first_name">First Name:</label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            required
        >

        <br><br>

        <label for="last_name">Last Name:</label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            required
        >

        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Register Company
        </button>

    </form>

</body>
</html>
