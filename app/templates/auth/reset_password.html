<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - RepRequest</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    {% include "partials/_head_icons.html" %}
</head>

<body>

    {% include "partials/_topbar.html" %}

    <div class="auth">
        <div class="auth__card">

            <img class="auth__logo"
                 src="{{ url_for('static', filename='img/logo.png') }}"
                 alt="RepRequest - Machine Management Software"
                 width="1200" height="310">

            <div class="auth__head">
                <h1>Choose a new password</h1>
                <p>This link works once and expires after 1 hour.</p>
            </div>

            {% if error %}
                <div class="alert alert--error" role="alert">
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <form class="form" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form__group">
                    <label class="form__label" for="new_password">New password</label>
                    <input class="form__control" type="password"
                           id="new_password" name="new_password"
                           autocomplete="new-password" minlength="8" required>
                    <span class="form__hint">At least 8 characters.</span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="confirm_password">Confirm new password</label>
                    <input class="form__control" type="password"
                           id="confirm_password" name="confirm_password"
                           autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" class="btn btn--primary btn--block btn--lg">
                    Save new password
                </button>

            </form>

        </div>
    </div>

    {% include "partials/_footer.html" %}

</body>

</html>
